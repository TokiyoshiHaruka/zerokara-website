services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zero_site}
      MYSQL_USER: ${MYSQL_USER:-zero_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zero_site}
      MYSQL_USER: ${MYSQL_USER:-zero_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me-long-random-string}
      ZERO_ADMIN_USERNAME: ${ZERO_ADMIN_USERNAME:-admin}
      ZERO_ADMIN_DISPLAY_NAME: ${ZERO_ADMIN_DISPLAY_NAME:-ZERO Admin}
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:-change-me-admin-password}
      NGINX_ACCESS_LOG: /var/log/nginx/access.log

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
